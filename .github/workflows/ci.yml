name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build -warnaserror
      - run: dotnet test --no-build
      - name: Publish (Native AOT)
        run: dotnet publish src/ZeroFactor -c Release -r linux-x64 -warnaserror -o out
      - name: Binary size
        run: ls -l out/ZeroFactor | tee -a "$GITHUB_STEP_SUMMARY"
